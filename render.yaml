# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard ("New +" -> "Blueprint"), or run
# `render blueprint launch` with the Render CLI. Provisions the API service only —
# DATABASE_URL points at an external Postgres (e.g. Neon's free tier) set manually in the
# dashboard, since Render's own free Postgres expires after 30 days. The frontend is
# deployed separately to Vercel/Netlify (see frontend/vercel.json, frontend/netlify.toml).
services:
  - type: web
    name: cycle-tracker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in the Render dashboard to your Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false   # set manually once your Vercel frontend URLs are known, e.g.
                      # '["https://your-classic-app.vercel.app","https://your-aura-app.vercel.app"]'
